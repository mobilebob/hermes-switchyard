target-version = "py311"
required-version = "==0.11.13"

[lint]
select = ["E4", "E7", "E9", "F"]

# These standalone scripts add the repository root to sys.path before importing
# repository modules, so their imports intentionally follow path setup.
[lint.per-file-ignores]
"scripts/ci/live_jev_contract.py" = ["E402"]
"scripts/ci/verify_release_candidate.py" = ["E402"]
"evaluation/turn_consolidation/screen.py" = ["E402"]
"evaluation/web_screening/evaluate.py" = ["E402"]

# Verbatim historical evidence, validated by content hashes rather than reformatted.
"evaluation/jev_transfer/frozen/**/*.py" = ["E402", "E701", "E702", "F401"]
