name: hermes-switchyard
version: 0.6.0
author: bgrablin
manifest_version: 1
description: Jev-powered skill and model routing with fast, safety-gated native computer use, full-catalog selection, typed decisions, and auditable receipts.
license: MIT
homepage: https://github.com/bgrablin/hermes-switchyard
tags: [jev, computer-use, routing, skills]
requires_env: []
optional_env:
  - name: OPENROUTER_API_KEY
    description: OpenRouter inference key for the Decisions endpoint; optional when TYPESAFE_API_KEY is configured
    url: https://openrouter.ai/keys
    secret: true
  - name: TYPESAFE_API_KEY
    description: Direct TypeSafe API key; preferred for the lowest-latency Jev route
    url: https://console.typesafe.ai/keys
    secret: true
provides_tools:
  - jev_assess
  - jev_computer_use
  - jev_skill_select
  - jev_skill_select_many
  - jev_model_route
  - jev_model_route_approved
  - jev_session_search_rerank
provides_hooks:
  - pre_tool_call
  - transform_tool_result
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - transform_llm_output
  - post_api_request
provides_middleware:
  - llm_request
config_schema:
  retrieved_screen_enabled: {type: bool, default: false, description: "Opt in to local instruction-pattern blocking in session-search cards and DOM observations. When off, search receipts retain shadow indicators without withholding evidence; DOM behavior is unchanged."}
  browser_plan_cache:
    type: bool
    default: false
    description: "Replay successful public link navigation only when goal, route, policy, and fresh page evidence match."
  smart_approval_provider: {type: bool, default: false, description: "Register the switchyard-approvals provider for explicit auxiliary.approval selection. Reviews bounded public or sanitized commands through OpenRouter Jev; does not change the host approval provider automatically."}
  consequential_tool_gate: {type: bool, default: false, description: "Ask native Hermes approval for explicit credential-path or irreversible-command indicators on terminal, execute_code, write_file, patch and delegate_task. Does not grant execution or replace native authorization."}
  repeated_output_compaction: {type: bool, default: false, description: "Compress consecutive duplicate lines in successful terminal output, preserving each unique line and repetition count. Full/verbatim output requests and uncertain turn captures bypass compaction. No Jev retention scoring or transcript compaction."}
  cross_tool_stuck_detection: {type: bool, default: false, description: "After three failures across different tools, send bounded redacted error excerpts to Jev once per scoped turn and append recovery advice when strongly supported. Never blocks tools or replaces native guards."}
  evidence_finder_enabled: {type: bool, default: false, description: "Opt-in automatic evidence prefetch for simple foreground requests naming one file or an explicit list of two to eight files. Sends bounded public or sanitized source text to the configured Jev provider before the main-model call. Other requests use ordinary Hermes tools. No finder tool is exposed."}
  evidence_finder_root: {type: str, default: "", description: "Operator-approved absolute directory for source prefetch. UTF-8 regular files, max 80000 bytes; no symlinks or hidden path components. Requires descriptor-relative no-follow support; unsupported hosts skip."}
  jev_provider: {type: str, default: "auto", description: auto prefers direct TypeSafe when TYPESAFE_API_KEY is available; also accepts typesafe or openrouter}
  api_endpoint: {type: str, default: "https://openrouter.ai/api/alpha/decisions", description: Fixed TypeSafe or OpenRouter Jev endpoint; arbitrary endpoints fail closed}
  jev_model: {type: str, default: "", description: Provider-specific Jev alias; empty selects jev-latest for TypeSafe or typesafe/jev-1.13 for OpenRouter}
  browser_executable: {type: str, default: "", description: "Optional absolute path to a Chromium-family browser for public-page DOM runs. Tried first; on a startup crash the discovered order follows (Google Chrome, non-snap Chromium, Edge, Playwright bundled Chromium, Snap Chromium)"}
  computer_max_steps: {type: int, default: 100, description: Full computer-use action budget; callers may choose a smaller per-call bound}
  approved_model_registry: {type: list, default: [], description: Profile-owned approved model records for jev_model_route_approved; provider account authorization and cost metadata are code-owned, never inferred}
  approved_model_registry_version: {type: str, default: "", description: Required operator-managed version identifier for the approved model registry}
  approved_model_registry_valid_until: {type: str, default: "", description: Required timezone-aware ISO-8601 expiry for the approved model registry}
  automatic_skill_recommendation: {type: bool, default: true, description: Enable bounded local skill recommendations in the pre_llm_call lifecycle hook}
  automatic_skill_consumer_mode: {type: str, default: "load", description: "load adopts via Hermes skill_view once per accepted turn (install default); advisory delivers recommendation context without adoption. Hosted automatic routing requires load mode; delivery, adoption, and outcome are recorded separately"}
  automatic_skill_candidates: {type: list, default: [], description: "Explicit skill candidate objects; an empty list uses the full Hermes active profile skills registry and candidate descriptions remain local-only for automatic hosted routing"}
  automatic_skill_local_threshold: {type: float, default: 0.2, description: "Local token-overlap threshold; it is an uncalibrated abstention policy"}
  automatic_skill_local_margin: {type: float, default: 0.05, description: "Required local winner margin; it is an uncalibrated abstention policy"}
  automatic_skill_cache_seconds: {type: float, default: 30.0, description: "Bounded per-process recommendation cache lifetime"}
  automatic_skill_deadline_seconds: {type: float, default: 20.0, description: "End-to-end wall-clock deadline for automatic hosted routing; kept below the typical Hermes ~30s plugin callback timeout and separate from explicit tool/computer-use deadlines"}
  automatic_skill_routing_mode: {type: str, default: "hosted_sanitized", description: "Automatic routing mode: off, local_only, or hosted_sanitized; hosted_sanitized is the install default and allows hosted construction with standing ack or a host turn_egress_policy allow envelope; opt down to local_only for privacy"}
  automatic_skill_jev: {type: bool, default: true, description: "Deprecated compatibility switch; retained for configuration compatibility and never authorizes hosted egress by itself; hosted_sanitized is the install default for automatic_skill_routing_mode"}
  automatic_skill_jev_mode: {type: str, default: "always", description: "always evaluates the full catalog on every allowed turn; uncertain_only is an explicit latency-saving override"}
  automatic_skill_honor_no_skill_gate: {type: bool, default: false, description: "When true, skip hosted skill fan-out when local lexical overlap is near zero even under automatic_skill_jev_mode=always. Default false preserves prior always-mode full fan-out for short opaque tasks (for example fix ci). Opt in to cut needless zero-overlap tax."}
  defer_switchyard_tool_schemas: {type: bool, default: false, description: "Opt-in experiment (default off). When true, omit hermes_switchyard decision-tool schemas (jev_assess, jev_skill_select*, jev_model_route*, jev_session_search_rerank) from the main model tool list on turns that will not call them (skill-route-only / light oneshots). Automatic skill pre_llm_call routing and receipts stay on. Fail-open: keep schemas when the user asks for jev_*/Switchyard tools, history already called them, or the session tool pin is Switchyard-primary. Does not defer jev_computer_use. Do not enable by default until prove-value."}
  automatic_skill_light_turn_bypass: {type: bool, default: true, description: "When true (default), skip hosted skill routing for closed-list acknowledgements and full-request greeting or read-only cwd-listing forms. Unknown wording, compound requests, and open-ended explanations retain normal routing. Set false to force hosted evaluation on those turns."}
  automatic_skill_early_light_bypass_before_discover: {type: bool, default: false, description: "When true, run the text-only light-turn bypass probe before catalog discover (skills_list). Default false preserves discover-then-recommend order. Fail-open: probe errors fall through to the current path. Explicit skill overrides and non-light turns still discover."}
  automatic_skill_public_or_sanitized_data_ack: {type: bool, default: true, description: "Standing operator attestation that automatic hosted turns are public or sanitized. On after install. With hosted_sanitized + load, a clean local scan authorizes hosting when no host envelope is present (egress_authority: standing_ack). Explicit deny/unknown/malformed/restricted envelopes and restricted local scans still fail closed. Set false to refuse hosted automatic routing."}
  automatic_skill_mandatory_skills: {type: list, default: [], description: "Exact skill identifiers treated as mandatory; load mode does not auto-load a different recommendation"}
  automatic_skill_two_stage: {type: bool, default: true, description: "Use the bounded two-stage hosted skill selector on allowed turns; false retains the legacy full-catalog selector"}
  automatic_skill_platforms: {type: list, default: [], description: "Hosted automatic routing platforms; empty uses the interactive default and skips machine-generated turns, [all] opts in every platform, or list exact platform names (include kanban to allow Kanban workers)"}
  automatic_skill_hosted_detail: {type: str, default: "names", description: "Second-stage hosted detail; names keeps skill descriptions local, descriptions sends bounded descriptions, excerpt additionally sends bounded SKILL.md excerpts. More detail requires deliberate opt-in and the existing egress gate"}
  automatic_skill_recheck_top_k: {type: int, default: 3, description: "Maximum stage-one finalists rechecked in stage two; clamped to 1 through 8"}
  automatic_skill_early_stop: {type: bool, default: true, description: "Permit a first-request needs-skill signal to stop a no-fit turn before catalog fan-out"}
  automatic_skill_early_stop_threshold: {type: float, default: 0.3, description: "Uncalibrated early-stop needs-skill policy threshold; clamped to 0 through 1"}
  automatic_skill_stage1_single_round: {type: bool, default: true, description: "Send all stage-1 partitions in one parallel round; false probes partition 0 first to save requests on no-fit turns"}
  automatic_skill_stage1_min_probability: {type: float, default: 0.05, description: "Uncalibrated stage-one candidate floor before recheck; clamped to 0 through 1"}
  automatic_skill_parallel_requests: {type: int, default: 4, description: "Maximum parallel stage-one requests within the shared deadline; clamped to 1 through 8 and the operation request cap"}
  shared_jev_skill_effort: {type: bool, default: false, description: "Experimental and OFF by default. Reuse a single validated Jev skill decision for the first adaptive effort decision only on clean, consenting foreground CLI turns using gpt-6-sol/openai-codex. Requires direct single-request hosted skill selection. Privacy, deadline, turn, provider identity or response mismatch falls back to independent effort selection; does not change models. Enable only in an isolated evaluation profile."}
  adaptive_reasoning_effort: {type: bool, default: true, description: "On after install. Jev may lower Hermes reasoning_effort for routine steps via llm_request middleware. To choose, it sends up to 1,200 characters of the clean current user message to Jev; history, tool output, and secret-like text are not sent, and the local scan is not DLP. Your /reasoning level is the cap; Jev failures send your level unchanged. Set false to disable; false is the privacy opt-out and sends no message text."}
  adaptive_reasoning_effort_mode: {type: str, default: "auto", description: "Start mode for new sessions: auto (Jev may lower effort, never above your level) or pinned (your level is sent unchanged). /switchyard effort auto|pin changes the current session. A /reasoning change sets a new cap and keeps the mode."}
  adaptive_reasoning_effort_exclude_models: {type: list, default: [], description: "Model name patterns (fnmatch, case-insensitive) the adapter never touches, for example [\"*astra*\"]. Excluded models make no Jev calls."}
  adaptive_reasoning_effort_allow_raise: {type: bool, default: false, description: "Off by default. When true, auto may go one level above your /reasoning level while the latest tool call failed."}
  adaptive_reasoning_effort_step_adaptation: {type: bool, default: true, description: "In a long turn with tool calls, auto may ask Jev again after routine read-only tool rounds, for at most one level below your /reasoning level. Only closed-set tool kinds (read, write, exec, other) and a count are sent; tool names and tool output are not sent. A write, a failed tool, a change request, or a high-stakes turn keeps your level. Set false for one decision per turn."}
  adaptive_reasoning_effort_receipt_mode: {type: str, default: "auto", description: "Foreground reasoning receipt: auto (default) shows a plain-language line when Switchyard changed effort or made/reused a decision, or every request passed through for no host effort / a level that cannot be adapted on the route, for example 'Reasoning: high→low · 180 ms' or 'Reasoning: kept at high — consequential request · 210 ms'; always also shows the last sent level when pinned or other pass-through with a known wire level (unsupported routes remain quiet); off shows none. Persists via /switchyard effort receipt always|auto|off (legacy work|on → auto). The model never gets the line back. Not added to delegated turns."}
  adaptive_reasoning_effort_receipt_line: {type: bool, default: true, description: "Legacy bool. Prefer adaptive_reasoning_effort_receipt_mode (auto|always|off). true maps to auto, false to off. Kept in sync when the command changes the mode."}
  adaptive_reasoning_effort_default: {type: str, default: "medium", description: "Deprecated and unused since 0.5.4. The fallback is always the level in the request."}
  adaptive_reasoning_effort_deadline_seconds: {type: float, default: 0.4, description: "Wall-clock budget for the adaptive-effort Jev Choice, 0.1 to 1.5 seconds. On timeout your level is sent unchanged."}
  session_search_rerank_choice_confidence_threshold: {type: float, default: 0.8, description: "Uncalibrated local policy threshold for jev_session_search_rerank; below this the tool fail-opens to stock FTS order"}
  session_search_rerank_winning_probability_threshold: {type: float, default: 0.8, description: "Uncalibrated winning-probability threshold for jev_session_search_rerank fail-open"}
  session_search_rerank_max_card_chars: {type: int, default: 360, description: "Per-card text cap after redaction for jev_session_search_rerank"}
  public_or_sanitized_data_ack: {type: bool, default: true, description: "Standing consent for Jev tool calls and for adaptive effort, which sends up to 1,200 characters of the clean current user message to Jev. On after install. Callers may omit the field. Set false to refuse Jev calls; adaptive effort then sends no message text."}
